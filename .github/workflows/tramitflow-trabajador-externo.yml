name: TramitFlow - trabajador externo

# Hace lo que las edge functions de Supabase no pueden: bajar de servidores
# que cortan a Supabase o solo hablan TLS antiguo, leer boletines a dos
# columnas y dar capa de texto (OCR) a PDFs escaneados.
# Habla solo con la edge function pf-trabajador-externo, con la clave propia
# del trabajador (secreto TRABAJADOR_CLAVE), nunca con la clave de servicio.
#
# Repositorio PUBLICO a proposito: GitHub no cobra los minutos de Actions de
# los repositorios publicos. Por eso aqui se trabaja cada hora y con dos
# carriles a la vez, cada uno con su propia cola:
#   - textos: normas y documentos municipales (descarga, lectura, OCR si hace falta)
#   - pdfs:   copias con capa de texto de PDFs ya guardados y fichas de ambito
#   - vistas: copia ligera (150 ppp) de cada plano, para verlo en pantalla
#   - estructura: paginado y bloques (tablas, figuras) de los PDF grandes, que
#     en el edge de Supabase se mueren por tiempo o memoria (Deno, mismo calculo)
# Si no hay trabajo, cada carril termina en segundos sin instalar nada. Si una
# ejecucion sigue en marcha, la siguiente espera (no se pisan).

on:
  schedule:
    - cron: "17 * * * *"   # cada hora
  workflow_dispatch:
    inputs:
      presupuesto_min:
        description: "Minutos de trabajo como maximo"
        default: "150"

permissions:
  contents: read

jobs:
  trabajar:
    strategy:
      fail-fast: false
      matrix:
        # 24/10 (Jose): cinco carriles de textos en paralelo. El repo es publico
        # y GitHub no cobra; el plan admite 20 trabajos a la vez en la cuenta.
        # La cola ya impide mas de 2 descargas a la vez contra la misma web, y
        # dos carriles nunca cogen el mismo documento (la toma solo marca lo que
        # sigue pendiente). Las fichas de sede, solo en el carril «textos».
        carril: [textos, textos-2, textos-3, textos-4, textos-5, pdfs, vistas, registros, hojas, estructura]
    concurrency:
      group: tramitflow-trabajador-externo-${{ matrix.carril }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 175
    env:
      TRABAJADOR_CLAVE: ${{ secrets.TRABAJADOR_CLAVE }}
      PRESUPUESTO_MIN: ${{ inputs.presupuesto_min || '150' }}
      # 07/10: lotes pequenos (5 textos), como mucho 4 tandas por hora y 2 min
      # de pausa entre tandas: no hay prisa y asi no se satura nada.
      # 24/10: Normas en Medium y 1.580 documentos municipales esperando a este
      # carril (la campana de ciudades esta parada porque la cola pasa del tope).
      # Con 5 x 4 = 20 por hora era el cuello de botella de todo lo municipal:
      # se sube a 15 x 8 = hasta 120 por hora, con 1 min entre tandas.
      MAX_TEXTOS: ${{ startsWith(matrix.carril, 'textos') && '15' || '0' }}
      MAX_RONDAS: ${{ startsWith(matrix.carril, 'textos') && '8' || '4' }}
      PAUSA_RONDA_S: ${{ startsWith(matrix.carril, 'textos') && '60' || '120' }}
      MAX_FICHAS: ${{ matrix.carril == 'textos' && '40' || '0' }}
      MAX_PDFS: ${{ matrix.carril == 'pdfs' && '2' || '0' }}
      MAX_VISTAS: ${{ matrix.carril == 'vistas' && '20' || '0' }}
      MAX_REGISTROS: ${{ matrix.carril == 'registros' && '10' || '0' }}
      # 17/10: hojas de las normas en PDF (el PDF se baja una vez, no cada 24
      # paginas como en la edge function) y recompresion sin perdida de los PNG
      # ya guardados en el bucket.
      MAX_HOJAS: ${{ matrix.carril == 'hojas' && '4' || '0' }}
      MAX_RECOMPRIMIR: ${{ matrix.carril == 'hojas' && '200' || '0' }}
      HOJAS_MIN: '150'
      # 17/10: paginado y bloques de los PDF grandes (scripts/trabajador-externo/estructura.ts)
      MAX_PAGINADO: ${{ matrix.carril == 'estructura' && '3' || '0' }}
      MAX_BLOQUES: ${{ matrix.carril == 'estructura' && '2' || '0' }}
      ESTRUCTURA_MIN: '150'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/trabajador-externo

      # Si no hay trabajo termina aqui, sin instalar nada.
      - name: Hay trabajo?
        id: contar
        if: matrix.carril != 'estructura'
        run: python3 scripts/trabajador-externo/externo.py contar

      # Carril de estructura: Deno (el mismo calculo que las edge functions).
      - name: Instalar Deno (estructura)
        if: matrix.carril == 'estructura'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Hay trabajo? (estructura)
        id: contar_e
        if: matrix.carril == 'estructura'
        run: deno run -A scripts/trabajador-externo/estructura.ts contar

      - name: Trabajar (estructura)
        if: matrix.carril == 'estructura' && steps.contar_e.outputs.hay == 'true'
        run: deno run -A scripts/trabajador-externo/estructura.ts trabajar

      - name: Instalar poppler y optipng (hojas)
        if: steps.contar.outputs.hay == 'true' && matrix.carril == 'hojas'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends poppler-utils optipng

      - name: Instalar poppler, qpdf y ocrmypdf
        if: steps.contar.outputs.hay == 'true' && matrix.carril != 'registros' && matrix.carril != 'hojas'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            poppler-utils qpdf ghostscript ocrmypdf tesseract-ocr tesseract-ocr-spa antiword python3-cryptography

      - name: Trabajar
        if: steps.contar.outputs.hay == 'true'
        run: python3 scripts/trabajador-externo/externo.py trabajar
